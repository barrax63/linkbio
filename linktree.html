
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkBio - Self-Hosted Link in Bio Tool</title>
    <meta name="description" content="My links, all in one place.">
    <meta property="og:title" content="LinkBio">
    <meta property="og:description" content="All my important links in one place.">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-card: #1a1a1a;
            --bg-card-hover: #222222;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent: #6c63ff;
            --accent-hover: #5a52d5;
            --accent-glow: rgba(108, 99, 255, 0.3);
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.12);
            --gradient-1: linear-gradient(135deg, #6c63ff 0%, #e91e63 100%);
            --gradient-2: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.5);
            --radius: 16px;
            --radius-sm: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: float 20s ease-in-out infinite;
        }

        .bg-orb-1 {
            width: 400px;
            height: 400px;
            background: #6c63ff;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .bg-orb-2 {
            width: 350px;
            height: 350px;
            background: #e91e63;
            bottom: -50px;
            right: -100px;
            animation-delay: -7s;
        }

        .bg-orb-3 {
            width: 300px;
            height: 300px;
            background: #00bcd4;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -14s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -30px) scale(1.05); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
            75% { transform: translate(20px, 10px) scale(1.02); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 680px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        /* Admin Panel */
        .admin-toggle {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--gradient-1);
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .admin-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px var(--accent-glow);
        }

        .admin-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 999;
            animation: fadeIn 0.3s ease;
        }

        .admin-overlay.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .admin-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            width: 90%;
            max-width: 560px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.3s ease;
        }

        .admin-panel::-webkit-scrollbar {
            width: 6px;
        }

        .admin-panel::-webkit-scrollbar-track {
            background: transparent;
        }

        .admin-panel::-webkit-scrollbar-thumb {
            background: var(--border-hover);
            border-radius: 3px;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .admin-header h2 {
            font-size: 22px;
            font-weight: 700;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .admin-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 28px;
            cursor: pointer;
            padding: 4px;
            transition: var(--transition);
            line-height: 1;
        }

        .admin-close:hover {
            color: var(--text-primary);
        }

        .admin-section {
            margin-bottom: 28px;
        }

        .admin-section h3 {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            margin-bottom: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: var(--transition);
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--gradient-1);
            color: white;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 25px var(--accent-glow);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--border-hover);
            background: var(--bg-card-hover);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        .btn-sm {
            padding: 8px 14px;
            font-size: 12px;
        }

        .admin-link-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-bottom: 12px;
            transition: var(--transition);
        }

        .admin-link-item:hover {
            border-color: var(--border-hover);
        }

        .admin-link-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .admin-link-title {
            font-weight: 600;
            font-size: 14px;
        }

        .admin-link-actions {
            display: flex;
            gap: 6px;
        }

        .admin-btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Profile Section */
        .profile {
            text-align: center;
            margin-bottom: 40px;
        }

        .avatar-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid transparent;
            background-image: var(--gradient-1);
            background-origin: border-box;
            background-clip: content-box, border-box;
            box-shadow: 0 0 30px var(--accent-glow);
            transition: var(--transition);
        }

        .avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px var(--accent-glow);
        }

        .avatar-placeholder {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: var(--gradient-1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: 700;
            color: white;
            box-shadow: 0 0 30px var(--accent-glow);
            transition: var(--transition);
        }

        .avatar-placeholder:hover {
            transform: scale(1.05);
        }

        .status-dot {
            position: absolute;
            bottom: 6px;
            right: 6px;
            width: 18px;
            height: 18px;
            background: #22c55e;
            border-radius: 50%;
            border: 3px solid var(--bg-primary);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
        }

        .profile-name {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .profile-handle {
            font-size: 15px;
            color: var(--accent);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .profile-bio {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 420px;
            margin: 0 auto 20px;
        }

        .profile-location {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        /* Social Icons */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 24px 0 36px;
            flex-wrap: wrap;
        }

        .social-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 18px;
            transition: var(--transition);
        }

        .social-icon:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        .social-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Links */
        .links-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            display: flex;
            align-items: center;
            padding: 18px 22px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            text-decoration: none;
            color: var(--text-primary);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--gradient-1);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .link-card:hover {
            transform: translateY(-3px);
            border-color: var(--border-hover);
            box-shadow: var(--shadow-md);
        }

        .link-card:hover::before {
            opacity: 0.05;
        }

        .link-card:active {
            transform: translateY(-1px);
        }

        .link-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 16px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
            background: rgba(108, 99, 255, 0.1);
            border: 1px solid rgba(108, 99, 255, 0.15);
        }

        .link-content {
            flex: 1;
            min-width: 0;
            position: relative;
            z-index: 1;
        }

        .link-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .link-description {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .link-arrow {
            position: relative;
            z-index: 1;
            color: var(--text-secondary);
            font-size: 18px;
            margin-left: 12px;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .link-card:hover .link-arrow {
            color: var(--accent);
            transform: translateX(3px);
        }

        /* Category Labels */
        .category-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin: 28px 0 8px;
            padding-left: 4px;
        }

        .category-label:first-child {
            margin-top: 0;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .footer-text {
            font-size: 12px;
            color: var(--text-secondary);
            opacity: 0.6;
        }

        .footer-text a {
            color: var(--accent);
            text-decoration: none;
        }

        /* Stats */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin: 20px 0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 20px;
            font-weight: 700;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* Theme selector */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .theme-option {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 10px;
            border: 2px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .theme-option:hover,
        .theme-option.active {
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .theme-option.active::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            font-size: 14px;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 2000;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Password modal */
        .password-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 1001;
            align-items: center;
            justify-content: center;
        }

        .password-modal.active {
            display: flex;
        }

        .password-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            animation: slideUp 0.3s ease;
        }

        .password-box h3 {
            margin-bottom: 8px;
            font-size: 18px;
        }

        .password-box p {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 20px;
        }

        .password-box .form-group {
            margin-bottom: 16px;
        }

        .password-error {
            color: #ef4444;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 24px 16px 48px;
            }

            .profile-name {
                font-size: 24px;
            }

            .link-card {
                padding: 14px 16px;
            }

            .link-icon {
                width: 38px;
                height: 38px;
                font-size: 17px;
                margin-right: 12px;
            }

            .admin-panel {
                padding: 24px;
                width: 95%;
            }

            .stats-bar {
                gap: 24px;
            }

            .social-icons {
                gap: 8px;
            }
        }

        /* Animations */
        .fade-in {
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .link-card:nth-child(1) { animation-delay: 0.05s; }
        .link-card:nth-child(2) { animation-delay: 0.1s; }
        .link-card:nth-child(3) { animation-delay: 0.15s; }
        .link-card:nth-child(4) { animation-delay: 0.2s; }
        .link-card:nth-child(5) { animation-delay: 0.25s; }
        .link-card:nth-child(6) { animation-delay: 0.3s; }
        .link-card:nth-child(7) { animation-delay: 0.35s; }
        .link-card:nth-child(8) { animation-delay: 0.4s; }
        .link-card:nth-child(9) { animation-delay: 0.45s; }
        .link-card:nth-child(10) { animation-delay: 0.5s; }

        /* Print */
        @media print {
            .admin-toggle, .bg-effects, .toast { display: none !important; }
            body { background: white; color: black; }
        }
    </style>
</head>
<body>
    <div class="bg-effects">
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="bg-orb bg-orb-3"></div>
    </div>

    <div class="container" id="mainContainer">
        <!-- Content rendered by JS -->
    </div>

    <button class="admin-toggle" id="adminToggle" title="Admin Panel">⚙️</button>

    <div class="toast" id="toast"></div>

    <!-- Password Modal -->
    <div class="password-modal" id="passwordModal">
        <div class="password-box">
            <h3>🔒 Admin Access</h3>
            <p>Enter your password to access the admin panel.</p>
            <div class="form-group">
                <input type="password" id="passwordInput" placeholder="Enter password..." autocomplete="off">
                <div class="password-error" id="passwordError">Incorrect password. Please try again.</div>
            </div>
            <div class="admin-btn-row" style="justify-content: center;">
                <button class="btn btn-primary" onclick="checkPassword()">Unlock</button>
                <button class="btn btn-secondary" onclick="closePasswordModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Admin Panel -->
    <div class="admin-overlay" id="adminOverlay">
        <div class="admin-panel">
            <div class="admin-header">
                <h2>⚡ Admin Panel</h2>
                <button class="admin-close" onclick="closeAdmin()">&times;</button>
            </div>

            <!-- Profile Settings -->
            <div class="admin-section">
                <h3>👤 Profile</h3>
                <div class="form-group">
                    <label>Display Name</label>
                    <input type="text" id="editName" placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label>Handle / Username</label>
                    <input type="text" id="editHandle" placeholder="@username">
                </div>
                <div class="form-group">
                    <label>Bio</label>
                    <textarea id="editBio" placeholder="Write something about yourself..."></textarea>
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="editLocation" placeholder="City, Country">
                </div>
                <div class="form-group">
                    <label>Avatar URL (leave empty for initial)</label>
                    <input type="text" id="editAvatar" placeholder="https://example.com/photo.jpg">
                </div>
                <button class="btn btn-primary" onclick="saveProfile()">💾 Save Profile</button>
            </div>

            <!-- Social Links -->
            <div class="admin-section">
                <h3>🌐 Social Icons</h3>
                <div id="socialEditor"></div>
                <div class="admin-btn-row" style="margin-top: 12px;">
                    <button class="btn btn-secondary btn-sm" onclick="addSocial()">+ Add Social</button>
                    <button class="btn btn-primary btn-sm" onclick="saveSocials()">💾 Save Socials</button>
                </div>
            </div>

            <!-- Links Manager -->
            <div class="admin-section">
                <h3>🔗 Links</h3>
                <div id="linksEditor"></div>

        const PLATFORM_OPTIONS = Object.keys(SOCIAL_ICONS);

        // ============================================
        // DATA MANAGEMENT
        // ============================================
        function getData() {
            const stored = localStorage.getItem('linkbio_data');
            if (stored) {
                try {
                    const parsed = JSON.parse(stored);
                    // Ensure clicks object exists
                    if (!parsed.clicks) parsed.clicks = {};
                    return parsed;
                } catch(e) {
                    return JSON.parse(JSON.stringify(DEFAULT_DATA));
                }
            }
            return JSON.parse(JSON.stringify(DEFAULT_DATA));
        }

        function saveData(data) {
            localStorage.setItem('linkbio_data', JSON.stringify(data));
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2800);
        }

        // ============================================
        // RENDERING
        // ============================================
        function render() {
            const data = getData();
            const container = document.getElementById('mainContainer');

            // Group links by category
            const activeLinks = data.links.filter(l => l.active);
            const categories = {};
            const uncategorized = [];

            activeLinks.forEach(link => {
                if (link.category && link.category.trim()) {
                    if (!categories[link.category]) categories[link.category] = [];
                    categories[link.category].push(link);
                } else {
                    uncategorized.push(link);
                }
            });

            // Total clicks
            const totalClicks = Object.values(data.clicks || {}).reduce((a, b) => a + b, 0);

            let html = `
                <div class="profile fade-in">
                    <div class="avatar-wrapper">
                        ${data.profile.avatar
                            ? `<img src="${escapeHtml(data.profile.avatar)}" alt="${escapeHtml(data.profile.name)}" class="avatar" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="avatar-placeholder" style="display:none">${getInitial(data.profile.name)}</div>`
                            : `<div class="avatar-placeholder">${getInitial(data.profile.name)}</div>`
                        }
                        <div class="status-dot"></div>
                    </div>
                    <h1 class="profile-name">${escapeHtml(data.profile.name)}</h1>
                    ${data.profile.handle ? `<p class="profile-handle">${escapeHtml(data.profile.handle)}</p>` : ''}
                    ${data.profile.bio ? `<p class="profile-bio">${escapeHtml(data.profile.bio)}</p>` : ''}
                    ${data.profile.location ? `<span class="profile-location">📍 ${escapeHtml(data.profile.location)}</span>` : ''}
                </div>
            `;

            // Social icons
            if (data.socials && data.socials.length > 0) {
                html += '<div class="social-icons fade-in">';
                data.socials.forEach(social => {
                    const icon = SOCIAL_ICONS[social.platform] || SOCIAL_ICONS.website;
                    html += `<a href="${escapeHtml(social.url)}" class="social-icon" target="_blank" rel="noopener noreferrer" title="${escapeHtml(social.platform)}">${icon}</a>`;
                });
                html += '</div>';
            }

            // Stats
            html += `
                <div class="stats-bar fade-in">
                    <div class="stat-item">
                        <div class="stat-number">${activeLinks.length}</div>
                        <div class="stat-label">Links</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">${formatNumber(totalClicks)}</div>
                        <div class="stat-label">Clicks</div>
                    </div>
                </div>
            `;

            // Links
            html += '<div class="links-section">';

            // Render categorized links
            const categoryNames = Object.keys(categories);
            categoryNames.forEach(cat => {
                html += `<div class="category-label">${escapeHtml(cat)}</div>`;
                categories[cat].forEach((link, i) => {
                    html += renderLinkCard(link, data);
                });
            });

            // Render uncategorized
            if (uncategorized.length > 0 && categoryNames.length > 0) {
                html += `<div class="category-label">Other</div>`;
            }
            uncategorized.forEach(link => {
                html += renderLinkCard(link, data);
            });

            html += '</div>';

            // Footer
            html += `
                <div class="footer fade-in">
                    <p class="footer-text">Powered by <a href="#">LinkBio</a> • Self-Hosted</p>
                </div>
            `;

            container.innerHTML = html;
        }

        function renderLinkCard(link, data) {
            const clickCount = data.clicks[link.url] || 0;
            return `
                <a href="${escapeHtml(link.url)}" class="link-card fade-in" target="_blank" rel="noopener noreferrer" onclick="trackClick('${escapeHtml(link.url)}')">
                    <div class="link-icon">${link.icon || '🔗'}</div>
                    <div class="link-content">
                        <div class="link-title">${escapeHtml(link.title)}</div>
                        ${link.description ? `<div class="link-description">${escapeHtml(link.description)}</div>` : ''}
                    </div>
                    <span class="link-arrow">→</span>
                </a>
            `;
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function getInitial(name) {
            return name ? name.charAt(0).toUpperCase() : '?';
        }

        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        // ============================================
        // CLICK TRACKING
        // ============================================
        function trackClick(url) {
            const data = getData();
            if (!data.clicks) data.clicks = {};
            data.clicks[url] = (data.clicks[url] || 0) + 1;
            saveData(data);
        }

        // ============================================
        // ADMIN PANEL
        // ============================================
        let isAuthenticated = false;

        document.getElementById('adminToggle').addEventListener('click', () => {
            if (isAuthenticated) {
                openAdmin();
            } else {
                document.getElementById('passwordModal').classList.add('active');
                document.getElementById('passwordInput').focus();
            }
        });

        document.getElementById('passwordInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') checkPassword();
        });

        function checkPassword() {
            const data = getData();
            const input = document.getElementById('passwordInput').value;
            if (input === data.password) {
                isAuthenticated = true;
                document.getElementById('passwordModal').classList.remove('active');
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordError').style.display = 'none';
                openAdmin();
            } else {
                document.getElementById('passwordError').style.display = 'block';
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').classList.remove('active');
            document.getElementById('passwordInput').value = '';
            document.getElementById('passwordError').style.display = 'none';
        }

        function openAdmin() {
            const data = getData();

            // Populate profile fields
            document.getElementById('editName').value = data.profile.name || '';
            document.getElementById('editHandle').value = data.profile.handle || '';
            document.getElementById('editBio').value = data.profile.bio || '';
            document.getElementById('editLocation').value = data.profile.location || '';
            document.getElementById('editAvatar').value = data.profile.avatar || '';

            // Render social editor
            renderSocialEditor(data.socials);

            // Render links editor
            renderLinksEditor(data.links);

            document.getElementById('adminOverlay').classList.add('active');
        }

        function closeAdmin() {
            document.getElementById('adminOverlay').classList.remove('active');
        }

        // Close admin on overlay click
        document.getElementById('adminOverlay').addEventListener('click', (e) => {
            if (e.target === document.getElementById('adminOverlay')) {
                closeAdmin();
            }
        });

        // Close on Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeAdmin();
                closePasswordModal();
            }
        });

        // ============================================
        // PROFILE EDITOR
        // ============================================
        function saveProfile() {
            const data = getData();
            data.profile.name = document.getElementById('editName').value.trim();
            data.profile.handle = document.getElementById('editHandle').value.trim();
            data.profile.bio = document.getElementById('editBio').value.trim();
            data.profile.location = document.getElementById('editLocation').value.trim();
            data.profile.avatar = document.getElementById('editAvatar').value.trim();
            saveData(data);
            render();
            showToast('✅ Profile saved!');
        }

        // ============================================
        // SOCIAL EDITOR
        // ============================================
        function renderSocialEditor(socials) {
            const container = document.getElementById('socialEditor');
            let html = '';
            socials.forEach((social, i) => {
                html += `
                    <div class="admin-link-item" data-social-index="${i}">
                        <div class="admin-link-header">
                            <span class="admin-link-title">${social.platform}</span>
                            <div class="admin-link-actions">
                                <button class="btn btn-danger btn-sm" onclick="removeSocial(${i})">✕</button>
                            </div>
                        </div>
                        <div class="form-group" style="margin-bottom:8px">
                            <select onchange="updateSocialField(${i}, 'platform', this.value)">
                                ${PLATFORM_OPTIONS.map(p => `<option value="${p}" ${p === social.platform ? 'selected' : ''}>${p}</option>`).join('')}
                            </select>
                        </div>
                        <div class="form-group" style="margin-bottom:0">
                            <input type="url" value="${escapeHtml(social.url)}" placeholder="URL" onchange="updateSocialField(${i}, 'url', this.value)">
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function updateSocialField(index, field, value) {
            const data = getData();
            if (data.socials[index]) {
                data.socials[index][field] = value;
                saveData(data);
            }
        }

        function addSocial() {
            const data = getData();
            data.socials.push({ platform: 'website', url: 'https://' });
            saveData(data);
            renderSocialEditor(data.socials);
            showToast('➕ Social added!');
        }

        function removeSocial(index) {
            const data = getData();
            data.socials.splice(index, 1);
            saveData(data);
            renderSocialEditor(data.socials);
            showToast('🗑 Social removed');
        }

        function saveSocials() {
            render();
            showToast('✅ Socials saved!');
        }

        // ============================================
        // LINKS EDITOR
        // ============================================
        function renderLinksEditor(links) {
            const container = document.getElementById('linksEditor');
            let html = '';
            links.forEach((link, i) => {
                const clicks = getData().clicks[link.url] || 0;
                html += `
                    <div class="admin-link-item" data-link-index="${i}">
                        <div class="admin-link-header">
                            <span class="admin-link-title">${link.icon || '🔗'} ${escapeHtml(link.title || 'Untitled')}</span>
                            <div class="admin-link-actions">
                                ${i > 0 ? `<button class="btn btn-secondary btn-sm" onclick="moveLink(${i}, -1)">↑</button>` : ''}
                                ${i < links.length - 1 ? `<button class="btn btn-secondary btn-sm" onclick="moveLink(${i}, 1)">↓</button>` : ''}
                                <button class="btn btn-danger btn-sm" onclick="removeLink(${i})">✕</button>
                            </div>
                        </div>
                        <div style="display:grid; grid-template-columns:60px 1fr; gap:8px; margin-bottom:8px">
                            <div class="form-group" style="margin-bottom:0">
                                <input type="text" value="${escapeHtml(link.icon)}" placeholder="Icon" onchange="updateLinkField(${i}, 'icon', this.value)" style="text-align:center">
                            </div>
                            <div class="form-group" style="margin-bottom:0">
                                <input type="text" value="${escapeHtml(link.title)}" placeholder="Title" onchange="updateLinkField(${i}, 'title', this.value)">
                            </div>
                        </div>
                        <div class="form-group" style="margin-bottom:8px">
                            <input type="text" value="${escapeHtml(link.description)}" placeholder="Description (optional)" onchange="updateLinkField(${i}, 'description', this.value)">
                        </div>
                        <div class="form-group" style="margin-bottom:8px">
                            <input type="url" value="${escapeHtml(link.url)}" placeholder="URL" onchange="updateLinkField(${i}, 'url', this.value)">
                        </div>
                        <div style="display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center;">
                            <div class="form-group" style="margin-bottom:0">
                                <input type="text" value="${escapeHtml(link.category)}" placeholder="Category (optional)" onchange="updateLinkField(${i}, 'category', this.value)">
                            </div>
                            <label style="display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text-secondary); cursor:pointer; white-space:nowrap;">
                                <input type="checkbox" ${link.active ? 'checked' : ''} onchange="updateLinkField(${i}, 'active', this.checked)">
                                Active
                            </label>
                        </div>
                        ${clicks > 0 ? `<div style="margin-top:8px; font-size:12px; color:var(--text-secondary);">📊 ${clicks} clicks</div>` : ''}
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function updateLinkField(index, field, value) {
            const data = getData();
            if (data.links[index]) {
                data.links[index][field] = value;
                saveData(data);
            }
        }

        function addLink() {
            const data = getData();
            data.links.push({
                title: 'New Link',
                description: '',
                url: 'https://',
                icon: '🔗',
                category: '',
                active: true
            });
            saveData(data);
            renderLinksEditor(data.links);
            showToast('➕ Link added!');
        }

        function removeLink(index) {
            if (!confirm('Remove this link?')) return;
            const data = getData();
            data.links.splice(index, 1);
            saveData(data);
            renderLinksEditor(data.links);
            showToast('🗑 Link removed');
        }

        function moveLink(index, direction) {
            const data = getData();
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= data.links.length) return;
            const temp = data.links[index];
            data.links[index] = data.links[newIndex];
            data.links[newIndex] = temp;
            saveData(data);
            renderLinksEditor(data.links);
        }

        function saveLinks() {
            render();
            showToast('✅ Links saved!');
        }

        // ============================================
        // PASSWORD
        // ============================================
        function savePassword() {
            const newPass = document.getElementById('editPassword').value.trim();
            if (!newPass) {
                showToast('⚠️ Password cannot be empty');
                return;
            }
            if (newPass.length < 4) {
                showToast('⚠️ Password must be at least 4 characters');
                return;
            }
            const data = getData();
            data.password = newPass;
            saveData(data);
            document.getElementById('editPassword').value = '';
            showToast('🔑 Password updated!');
        }

        // ============================================
        // EXPORT / IMPORT / RESET
        // ============================================
        function exportData() {
            const data = getData();
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `linkbio-backup-${new Date().toISOString().slice(0, 10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('📤 Data exported!');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.profile && imported.links) {
                        saveData(imported);
                        render();
                        openAdmin();
                        showToast('📥 Data imported successfully!');
                    } else {
                        showToast('⚠️ Invalid file format');
                    }
                } catch (err) {
                    showToast('⚠️ Error reading file');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function resetData() {
            if (!confirm('Are you sure? This will delete ALL your data and restore defaults.')) return;
            if (!confirm('This cannot be undone. Really reset everything?')) return;
            localStorage.removeItem('linkbio_data');
            render();
            openAdmin();
            showToast('🗑 All data reset to defaults');
        }

        // ============================================
        // INITIALIZE
        // ============================================
        // Initialize data if first visit
        if (!localStorage.getItem('linkbio_data')) {
            saveData(DEFAULT_DATA);
        }

        // Render the page
        render();

        // Update page title
        const pageData = getData();
        document.title = `${pageData.profile.name} | LinkBio`;

        // Service Worker registration for PWA-like behavior (optional)
        if ('serviceWorker' in navigator && location.protocol === 'https:') {
            // You can add a service worker for offline support
        }
    </script>
</body>
</html>
